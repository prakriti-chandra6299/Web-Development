<!--
HTML META TAGS - IMPORTANT TERMS

1. <meta>
   Provides information about the webpage.

2. charset
   Defines the character encoding.

   Example:
   <meta charset="UTF-8">

3. viewport
   Controls how the webpage behaves on different
   screen sizes.

4. description
   Provides a description of the webpage.

5. author
   Specifies the author of the webpage.

IMPORTANT:

<meta> → information about the webpage
charset → character encoding
viewport → screen/display settings
description → page description
author → page author

-->
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="My HTML learning journey">

    <meta name="author" content="My Name">

    <title>HTML Meta Tags</title>

</head>

<body>

    <h1>HTML Meta Tags</h1>

    <p>
        I am learning about HTML meta tags.
    </p>

</body>

</html>
