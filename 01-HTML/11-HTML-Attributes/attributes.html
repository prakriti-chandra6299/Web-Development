<!--
HTML ATTRIBUTES - IMPORTANT TERMS

1. Attribute
   Provides additional information about an HTML element.

2. Attribute Name
   Specifies what information the attribute provides.

3. Attribute Value
   Specifies the value assigned to an attribute.

4. Syntax
   Attributes are written inside the opening tag.

   Example:
   <p class="highlight">Hello</p>

   class → attribute name
   "highlight" → attribute value

5. href
   Specifies the destination URL of a link.

   Example:
   <a href="https://www.google.com">Google</a>

6. src
   Specifies the source of an external resource.

   Example:
   <img src="image.jpg">

7. alt
   Provides alternative text for an image.

   Example:
   <img src="image.jpg" alt="My Image">

8. id
   Gives an element a unique identifier.

   Example:
   <p id="intro">Hello</p>

9. class
   Assigns an element to one or more classes.

   Example:
   <p class="highlight">Hello</p>

10. title
    Provides additional information about an element.

    Example:
    <p title="This is a paragraph">Hello</p>

11. style
    Adds inline CSS styling to an element.

    Example:
    <p style="color: blue;">Hello</p>

12. Attribute Values
    Attribute values are usually written inside quotation marks.

    Example:
    class="heading"

IMPORTANT:

Attribute → gives additional information
Attribute name → what information is being given
Attribute value → the actual value

Example:

<a href="https://www.google.com">

href → attribute
"https://www.google.com" → attribute value
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Attributes</title>
</head>

<body>

    <h1>HTML Attributes</h1>

    <h2 title="This is a heading">My Heading</h2>

    <p id="intro" class="highlight">
        I am learning HTML attributes.
    </p>

    <a href="https://www.google.com" target="_blank">
        Visit Google
    </a>

    <br><br>

    <img src="image.png" alt="My Image" width="300">

</body>

</html>
