<!--
HTML IMAGES - IMPORTANT TERMS

1. <img>
   Used to display an image.

2. src
   Specifies the image source/path.

3. alt
   Provides alternative text for the image.

4. width
   Sets the image width.

5. height
   Sets the image height.

6. title
   Provides additional information about the image.

IMPORTANT:

<img> → image
src    → image source
alt    → alternative text
width  → image width
height → image height
title  → additional information
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Images</title>
</head>

<body>

    <h1>HTML Images</h1>

    <h2>My Image</h2>

    <img
        src="image.png"
        alt="A sample image"
        width="400"
        height="300"
        title="My Sample Image">

</body>

</html>
