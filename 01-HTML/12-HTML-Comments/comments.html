<!--
HTML COMMENTS - IMPORTANT TERMS

1. HTML Comment
   Text in HTML that is not displayed on the webpage.


2. Single-Line Comment
   Used for short notes.

3. Multi-Line Comment
   Used for longer notes.

4. Uses
   - Explain code
   - Organize code
   - Leave notes
   - Temporarily disable code

IMPORTANT:
Comments are not displayed on the webpage,
but they can be seen in the HTML source code.
-->


<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Comments</title>
</head>

<body>

    <!-- Main heading of the webpage -->
    <h1>HTML Comments</h1>

    <!-- Introduction paragraph -->
    <p>
        I am learning HTML comments.
    </p>

    <ul>
        <li>C++</li>

        <li>Python</li>
    </ul>

    <!--
        This is a multi-line comment.

        The browser will not display
        any of this text on the webpage.
    -->

    <h2>My Web Development Journey</h2>

    <p>
        I am learning HTML step by step.
    </p>

</body>

</html>
