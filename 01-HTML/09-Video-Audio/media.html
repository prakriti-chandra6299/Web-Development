<!--
HTML VIDEO AND AUDIO - IMPORTANT TERMS

1. <video>
   Used to embed a video in a webpage.

2. <audio>
   Used to embed audio in a webpage.

3. controls
   Displays playback controls such as play,
   pause, volume, and progress.

4. width
   Sets the width of a video.

5. height
   Sets the height of a video.

6. autoplay
   Makes the media start automatically.

7. loop
   Repeats the media continuously.

8. muted
   Starts the media without sound.

9. poster
   Sets an image displayed before the video plays.

10. <source>
    Specifies the media file and its format.

IMPORTANT:

<video> → video
<audio> → audio
controls → playback controls
autoplay → starts automatically
loop → repeats
muted → no sound
poster → preview image
<source> → media source
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Video and Audio</title>
</head>

<body>

    <h1>HTML Video and Audio</h1>
    

    <h1>HTML Video and Audio</h1>

    <h2>My Video</h2>

    <video src="video.mp4" controls width="500"></video>

    <h2>My Audio</h2>

    <audio src="audio.mp3" controls></audio>


</body>

</html>
