<!--
HTML LINKS - IMPORTANT TERMS

1. <a>
   Creates a hyperlink.

2. href
   Specifies where the link goes.

3. target="_blank"
   Opens the link in a new tab/window.

4. mailto:
   Creates an email link.

5. tel:
   Creates a phone link.

6. #id
   Links to a specific section of the same page.

IMPORTANT:

<a> → link
href → destination
target → where to open
mailto: → email
tel: → phone
#id → page section
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Links</title>
</head>

<body>

    <h1>HTML Links</h1>

    <h2>Website Link</h2>

    <a href="https://www.google.com" target="_blank">
        Visit Google
    </a>

    <h2>Email Link</h2>

    <a href="mailto:example@gmail.com">
        Send an Email
    </a>

    <h2>Phone Link</h2>

    <a href="tel:+911234567890">
        Call Us
    </a>

    <h2>Page Bookmark</h2>

    <a href="#projects">
        Go to My Projects
    </a>

    <br><br><br><br><br><br>

    <h2 id="projects">My Projects</h2>

    <p>
        Here I will add my web development projects.
    </p>

</body>

</html>
