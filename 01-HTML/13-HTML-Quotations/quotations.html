<!--
HTML QUOTATIONS - IMPORTANT TERMS

1. <blockquote>
   Used for a longer quotation.

2. <q>
   Used for a short inline quotation.

3. <cite>
   Used for the title of a work, such as a book,
   movie, song, or article.

4. cite attribute
   Specifies the source URL of a quotation.

IMPORTANT:

<blockquote> → long quotation
<q>          → short quotation
<cite>       → title of a work
cite=""      → source URL
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Quotations</title>
</head>

<body>

    <h1>HTML Quotations</h1>

    <h2>Short Quotation</h2>

    <p>
        My teacher said,
        <q>Practice makes progress.</q>
    </p>

    <h2>Long Quotation</h2>

    <blockquote>
        Learning to code takes time and practice.
        Keep building projects and improving every day.
    </blockquote>

    <h2>Citation</h2>

    <p>
        I am reading <cite>Clean Code</cite>.
    </p>

</body>

</html>
