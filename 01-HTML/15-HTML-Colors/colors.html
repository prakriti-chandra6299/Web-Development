<!--
HTML COLORS - IMPORTANT TERMS

1. Color Names
   Use predefined color names.

   Example:
   color: red;

2. RGB
   Represents a color using Red, Green, Blue.

   Example:
   rgb(255, 0, 0)

3. HEX
   Represents a color using hexadecimal values.

   Example:
   #ff0000

IMPORTANT:

Color name → red
RGB        → rgb(255, 0, 0)
HEX        → #ff0000
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Colors</title>
</head>

<body>

    <h1>HTML Colors</h1>

    <h2 style="color: red;">Color Name</h2>

    <h2 style="color: rgb(0, 128, 0);">RGB Color</h2>

    <h2 style="color: #0000ff;">HEX Color</h2>

    <p style="color: purple;">
        This paragraph uses a color name.
    </p>

    <p style="color: rgb(255, 165, 0);">
        This paragraph uses RGB.
    </p>

    <p style="color: #ff00ff;">
        This paragraph uses HEX.
    </p>

</body>

</html>
