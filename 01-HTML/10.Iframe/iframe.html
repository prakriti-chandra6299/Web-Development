<!--
HTML IFRAME - IMPORTANT TERMS

1. <iframe> = Inline Frame
   Used to embed another webpage or external
   content inside the current webpage.

2. src = Source
   Specifies the URL of the content to embed.

3. width
   Sets the width of the iframe.

4. height
   Sets the height of the iframe.

5. title
   Describes the content of the iframe.

IMPORTANT:

<iframe> → embeds external content
src      → source/URL
width    → iframe width
height   → iframe height
title    → description of iframe content
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Iframe</title>
</head>

<body>

    <h1>HTML Iframe</h1>
    <h2>My First Iframe</h2>

    <iframe width="560" height="315"
    src="https://www.youtube.com/embed/CyRlWlaJnTY?si=ahznzIvDA59dJfbK"
    title="YouTube video player"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen>
</iframe>
</body>

</html>
