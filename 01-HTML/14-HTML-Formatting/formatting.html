<!--
HTML TEXT FORMATTING - IMPORTANT TERMS

1. <b>       → Bold text
2. <strong>  → Important text
3. <i>       → Italic text
4. <em>      → Emphasized text
5. <mark>    → Highlighted text
6. <small>   → Smaller text
7. <del>     → Deleted text
8. <ins>     → Inserted text
9. <sub>     → Subscript
10. <sup>    → Superscript

IMPORTANT:

<b> / <i> → Mainly visual formatting
<strong> / <em> → Give semantic meaning
-->
    <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Formatting</title>
</head>

<body>

    <h1>HTML Text Formatting</h1>

    <p><b>This text is bold.</b></p>

    <p><strong>This text is important.</strong></p>

    <p><i>This text is italic.</i></p>

    <p><em>This text is emphasized.</em></p>

    <p><mark>This text is highlighted.</mark></p>

    <p><small>This is smaller text.</small></p>

    <p><del>This text is deleted.</del></p>

    <p><ins>This text is inserted.</ins></p>

    <p>Water formula: H<sub>2</sub>O</p>

    <p>Mathematical expression: x<sup>2</sup></p>

</body>

</html>
