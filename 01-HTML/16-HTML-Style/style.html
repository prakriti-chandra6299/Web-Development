<!--
HTML STYLES - IMPORTANT TERMS

1. style
   Used to add CSS styling directly to an HTML element.

2. color
   Changes the text color.

3. background-color
   Changes the background color.

4. font-size
   Changes the size of text.

5. text-align
   Controls the alignment of text.

IMPORTANT:

style="property: value;"

Example:
style="color: blue;"
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Styles</title>
</head>

<body>

    <h1 style="color: blue;">HTML Styles</h1>

    <p style="color: green;">
        This text is green.
    </p>

    <p style="background-color: yellow;">
        This paragraph has a yellow background.
    </p>

    <p style="font-size: 24px;">
        This text is larger.
    </p>

    <p style="text-align: center;">
        This text is centered.
    </p>

    <p style="color: white; background-color: black; text-align: center;">
        Multiple styles can be used together.
    </p>

</body>

</html>
