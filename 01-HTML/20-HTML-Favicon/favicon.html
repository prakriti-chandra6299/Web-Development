<!--
HTML FAVICON - IMPORTANT TERMS

1. Favicon
   A small icon displayed in the browser tab.

2. <link>
   Used to connect an external resource to the HTML page.

3. rel="icon"
   Specifies that the linked file is the favicon.

4. href
   Specifies the favicon file location.

IMPORTANT:

Favicon → browser tab icon
<link>   → connects external resource
rel      → relationship
href     → file location
-->
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="favicon.png">

    <title>HTML Favicon</title>

</head>

<body>

    <h1>HTML Favicon</h1>

    <p>
        Look at the browser tab to see the favicon.
    </p>

</body>

</html>
