<!--
CSS RESPONSIVE DESIGN - IMPORTANT TERMS

1. Responsive Design
   Responsive design makes a webpage adapt
   to different screen sizes.

2. Viewport
   The visible area of a webpage on a device.

3. Media Query
   Allows CSS to apply different styles
   depending on screen size.

4. max-width
   Sets the maximum width of an element.

5. width: 100%
   Allows an element to use the available width.

IMPORTANT:

Responsive website
→ Desktop + Tablet + Mobile

The goal is to make a webpage easy to use
on different screen sizes.
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CSS Responsive Design</title>

    <link rel="stylesheet" href="responsive.css">

</head>

<body>

    <h1>Responsive Design</h1>

    <div class="container">

        <div class="box">
            Box 1
        </div>

        <div class="box">
            Box 2
        </div>

        <div class="box">
            Box 3
        </div>

    </div>

</body>

</html>
