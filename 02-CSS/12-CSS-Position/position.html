<!--
CSS POSITION - IMPORTANT TERMS

The position property controls how an element
is positioned on a webpage.

1. static
   Default position of an element.

2. relative
   Positions an element relative to its
   normal position.

3. absolute
   Positions an element relative to its
   nearest positioned ancestor.

4. fixed
   Keeps an element fixed relative to
   the browser window.

5. sticky
   Acts like relative until a specified
   position is reached, then behaves like fixed.

IMPORTANT:

position: static;
→ Default position

position: relative;
→ Moves relative to its normal position

position: absolute;
→ Positioned relative to a positioned ancestor

position: fixed;
→ Stays fixed on the screen

position: sticky;
→ Sticks when scrolling reaches its position
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Position</title>

    <link rel="stylesheet" href="position.css">

</head>

<body>

    <h1>CSS Position</h1>

    <div class="container">

        <div class="box relative">
            Relative
        </div>

        <div class="box absolute">
            Absolute
        </div>

    </div>

</body>

</html>
