
<!--
IMPORTANT TERMS
1. Animation: Changes an element's style over time.
2. @keyframes: Defines the stages of an animation.
3. translateY(): Moves an element vertically.
4. animation-duration: Sets the time for one cycle.
5. animation-iteration-count: Sets the number of repetitions.
6. animation-timing-function: Controls animation speed.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Bounce Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Bounce Animation</h1>
    <p>Watch the ball bounce up and down.</p>

    <div class="stage">
        <div class="ball"></div>
    </div>

    <p class="hint">Try changing the animation duration!</p>

</body>
</html>
