<!--
CSS FLOAT & CLEAR - IMPORTANT TERMS

1. float
   Moves an element to the left or right side
   of its container.

   Values:
   left
   right
   none

2. clear
   Prevents an element from being affected
   by floated elements.

   Values:
   left
   right
   both
   none

3. text-align
   Controls the alignment of text.

   Values:
   left
   right
   center
   justify

IMPORTANT:

float: left;
→ Moves the element to the left.

float: right;
→ Moves the element to the right.

clear: both;
→ Prevents floating elements from appearing
  beside the element.

NOTE:
Float and clear are older layout techniques.
Modern layouts usually use Flexbox or Grid,
but understanding them is important.
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Float and Clear</title>

    <link rel="stylesheet" href="float-clear.css">

</head>

<body>

    <div class="container">

        <h1>My Store</h1>

        <div id="fruit" class="item">

            <h2>Fruits</h2>

            <p>
                We sell fresh fruits such as apples,
                bananas, oranges and mangoes.
            </p>

        </div>

        <div id="computer" class="item">

            <h2>Computers</h2>

            <p>
                We sell computers, laptops and
                other electronic products.
            </p>

        </div>

        <div id="stationery" class="item">

            <h2>Stationery</h2>

            <p>
                We sell notebooks, pens and
                other stationery products.
            </p>

        </div>

    </div>

</body>

</html>
