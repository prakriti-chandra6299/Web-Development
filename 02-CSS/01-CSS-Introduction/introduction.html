<!--
CSS INTRODUCTION - IMPORTANT TERMS

1. CSS
   CSS stands for Cascading Style Sheets.
   It is used to style and design HTML webpages.

2. HTML vs CSS
   HTML → Creates the structure of a webpage.
   CSS  → Controls the appearance of the webpage.

3. What CSS can do
   - Change colors
   - Change fonts
   - Change sizes
   - Add backgrounds
   - Add borders
   - Control spacing
   - Create layouts

IMPORTANT:

HTML → Structure
CSS  → Style / Design

Example:
<h1>Hello</h1>

HTML creates the heading.
CSS can change how the heading looks.
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Introduction</title>

</head>

<body>

    <h1>Welcome to CSS</h1>

    <p>I am learning CSS.</p>

</body>

</html>
