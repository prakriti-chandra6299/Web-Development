<!--
WAYS TO ADD CSS - IMPORTANT TERMS

There are 3 main ways to add CSS to HTML:

1. Inline CSS
   CSS is written directly inside the HTML element
   using the style attribute.

   Example:
   <h1 style="color: blue;">Hello</h1>

2. Internal CSS
   CSS is written inside a <style> tag
   in the <head> section of the HTML file.

   Example:
   <style>
       h1 {
           color: green;
       }
   </style>

3. External CSS
   CSS is written in a separate .css file
   and connected using the <link> tag.

   Example:
   <link rel="stylesheet" href="style.css">

IMPORTANT:

Inline CSS    → Inside the HTML element
Internal CSS  → Inside <style> in <head>
External CSS  → Separate CSS file

External CSS is generally preferred for larger
websites because it keeps HTML and CSS separate.
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ways to Add CSS</title>

    <!-- Internal CSS -->
    <style>

        h2 {
            color: green;
        }

    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="ways-to-add-css.css">

</head>

<body>

    <!-- Inline CSS -->
    <h1 style="color: red;">
        Inline CSS
    </h1>

    <h2>
        Internal CSS
    </h2>

    <p>
        This paragraph is styled using external CSS.
    </p>

</body>

</html>
