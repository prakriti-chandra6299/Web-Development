
<!--
CSS GRID LAYOUT EXERCISE - IMPORTANT TERMS

1. Grid Container
   The parent element using display: grid.

2. Grid Columns
   Divide the layout into vertical sections.

3. Grid Rows
   Divide the layout into horizontal sections.

4. grid-column
   Controls an item's position across columns.

5. grid-area
   Can assign an item to a named grid area.

GOAL:
Create a website layout using CSS Grid.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Layout Exercise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">Website Header</header>

    <nav class="navbar">Navigation Menu</nav>

    <main class="content">
        <section class="main-content">
            <h2>Main Content</h2>
            <p>This is the main section of the website.</p>
        </section>

        <aside class="sidebar">
            <h2>Sidebar</h2>
            <p>Additional information goes here.</p>
        </aside>
    </main>

    <footer class="footer">Website Footer</footer>

</body>
</html>
