<!--
HOW CSS WORKS - IMPORTANT TERMS

1. CSS Rule
   A CSS rule tells the browser how an HTML element
   should be styled.

2. Selector
   Selects the HTML element that we want to style.

3. Property
   Specifies what we want to change.

4. Value
   Specifies how we want to change the property.

5. Declaration
   A property and its value together form a declaration.

BASIC STRUCTURE:

selector {
    property: value;
}

Example:

h1 {
    color: blue;
}

h1      → selector
color   → property
blue    → value

The browser:
HTML → Creates the elements
CSS  → Finds the elements and applies styling
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>How CSS Works</title>

    <link rel="stylesheet" href="working.css">

</head>

<body>

    <h1>How CSS Works</h1>

    <p>
        CSS selects HTML elements and applies styling to them.
    </p>

    <p>
        This paragraph demonstrates how CSS changes
        the appearance of HTML content.
    </p>

</body>

</html>
