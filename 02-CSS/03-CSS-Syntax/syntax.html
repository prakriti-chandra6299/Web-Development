<!--
CSS SYNTAX - IMPORTANT TERMS

1. Selector
   Selects the HTML element that we want to style.

2. Property
   Specifies what we want to change.

3. Value
   Specifies how we want to change it.

4. Declaration
   A property and its value together form a declaration.

BASIC CSS SYNTAX:

selector {
    property: value;
}

Example:

h1 {
    color: blue;
}

h1      → Selector
color   → Property
blue    → Value

IMPORTANT:

Selector → What to style
Property → What to change
Value    → How to change it

Multiple declarations can be written
inside the same CSS rule.
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Syntax</title>

    <link rel="stylesheet" href="syntax.css">

</head>

<body>

    <h1>CSS Syntax</h1>

    <p>This paragraph is styled using CSS.</p>

</body>

</html>
