<!--
CSS FONTS - IMPORTANT TERMS

1. font-family
   Specifies the typeface used for text.

2. font-size
   Controls the size of the text.

3. font-style
   Changes the style of text.

   Example:
   font-style: italic;

4. font-weight
   Controls how bold the text appears.

   Example:
   font-weight: bold;

5. text-align
   Controls the horizontal alignment of text.

   Values:
   left
   center
   right

IMPORTANT:

font-family → Type of font
font-size   → Size of text
font-style  → Style of text
font-weight → Thickness of text
text-align  → Text alignment
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Fonts</title>

    <link rel="stylesheet" href="fonts.css">

</head>

<body>

    <h1>CSS Fonts</h1>

    <p class="normal">
        This is normal text.
    </p>

    <p class="italic">
        This text is italic.
    </p>

    <p class="bold">
        This text is bold.
    </p>

    <p class="center">
        This text is centered.
    </p>

</body>

</html>
