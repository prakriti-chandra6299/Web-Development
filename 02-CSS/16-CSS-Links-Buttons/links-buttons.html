<!--
CSS LINKS & BUTTONS - IMPORTANT TERMS

1. Link
   A link is created using the <a> tag.

2. :link
   Represents a link that has not been visited.

3. :visited
   Represents a link that has already been visited.

4. :hover
   Applies styling when the mouse pointer
   is placed over the element.

5. :active
   Applies styling while the link is being clicked.

6. Button Styling
   CSS can be used to change the appearance
   of buttons.

IMPORTANT:

a:link
→ Unvisited link

a:visited
→ Visited link

a:hover
→ Mouse is over the link

a:active
→ Link is being clicked

Common button properties:
- background-color
- color
- padding
- border
- border-radius
- cursor
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Links and Buttons</title>

    <link rel="stylesheet" href="links-buttons.css">

</head>

<body>

    <h1>CSS Links & Buttons</h1>

    <h2>Styled Link</h2>

    <a class="link" href="https://www.google.com" target="_blank">
        Visit Google
    </a>

    <h2>Styled Button</h2>

    <button class="btn">
        Click Me
    </button>

</body>

</html>
