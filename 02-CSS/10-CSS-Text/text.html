<!--
CSS TEXT - IMPORTANT TERMS

1. color
   Changes the color of text.

2. text-align
   Aligns text horizontally.

   Values:
   left
   center
   right

3. text-decoration
   Adds or removes decoration from text.

   Examples:
   underline
   overline
   line-through
   none

4. text-transform
   Changes the capitalization of text.

   Values:
   uppercase
   lowercase
   capitalize

5. text-indent
   Adds space before the first line of text.

6. line-height
   Controls the space between lines of text.

IMPORTANT:

color           → Text color
text-align      → Text alignment
text-decoration → Text decoration
text-transform  → Text capitalization
text-indent     → Indentation
line-height     → Space between lines
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Text</title>

    <link rel="stylesheet" href="text.css">

</head>

<body>

    <h1>CSS Text Properties</h1>

    <h2>Text Alignment</h2>

    <p class="center">
        This text is centered.
    </p>

    <h2>Text Decoration</h2>

    <p class="underline">
        This text is underlined.
    </p>

    <h2>Text Transform</h2>

    <p class="uppercase">
        this text will become uppercase.
    </p>

    <h2>Line Height</h2>

    <p class="spacing">
        CSS can control the space between lines.
        This makes longer paragraphs easier to read.
    </p>

</body>

</html>
