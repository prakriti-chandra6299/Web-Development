
<!--
CSS GRID - IMPORTANT TERMS

1. CSS Grid
   A layout system for arranging elements
   into rows and columns.

2. Grid Container
   The parent element with display: grid.

3. Grid Items
   The direct children of a grid container.

4. grid-template-columns
   Defines the number and size of columns.

5. grid-template-rows
   Defines the number and size of rows.

6. gap
   Adds space between rows and columns.

IMPORTANT:

Grid Container
→ Grid Items
→ Rows + Columns

The goal is to create structured layouts
using CSS Grid.
-->

</html>
