<!--
CSS COLORS - IMPORTANT TERMS

CSS provides different ways to specify colors.

1. Color Name
   Use a predefined color name.

   Example:
   color: red;

2. HEX Color
   Uses a hexadecimal value.

   Example:
   color: #ff0000;

3. RGB Color
   Uses Red, Green, and Blue values.

   Example:
   color: rgb(255, 0, 0);

4. Background Color
   Changes the background color of an element.

   Example:
   background-color: yellow;

IMPORTANT:

color
→ Changes the text color.

background-color
→ Changes the background color.

Common color formats:
- Color names
- HEX
- RGB
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Colors</title>

    <link rel="stylesheet" href="colors.css">

</head>

<body>

    <h1>CSS Colors</h1>

    <p class="name">
        This text uses a color name.
    </p>

    <p class="hex">
        This text uses a HEX color.
    </p>

    <p class="rgb">
        This text uses an RGB color.
    </p>

    <div class="box">
        This element has a background color.
    </div>

</body>

</html>
