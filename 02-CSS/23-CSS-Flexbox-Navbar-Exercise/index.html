
<!--
IMPORTANT TERMS
1. Navbar: Navigation bar for a website.
2. Flexbox: CSS layout system for arranging elements.
3. display: flex: Places items in a flexible layout.
4. justify-content: Controls horizontal spacing.
5. align-items: Aligns items along the cross axis.
6. gap: Adds space between items.
7. :hover: Applies styles when the pointer is over an item.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Navbar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">StudySpace</div>

        <nav>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#courses">Courses</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>

        <a href="#login" class="login-btn">Login</a>
    </header>

    <main id="home">
        <h1>Welcome to StudySpace</h1>
        <p>Learn, practise, and build something amazing.</p>
    </main>

</body>
</html>
