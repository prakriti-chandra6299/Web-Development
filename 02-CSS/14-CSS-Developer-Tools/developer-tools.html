<!--
CSS DEVELOPER TOOLS - IMPORTANT TERMS

1. Developer Tools
   Developer Tools are built-in browser tools
   used to inspect and debug webpages.

2. Inspect
   Allows us to inspect the HTML and CSS
   of an element on a webpage.

3. Elements Panel
   Shows the HTML structure of the webpage.

4. Styles Panel
   Shows the CSS rules applied to an element.

5. Live Editing
   We can temporarily change HTML and CSS
   directly inside Developer Tools.

IMPORTANT:

Developer Tools can be used to:

- Inspect HTML elements
- Inspect CSS styles
- Test CSS changes
- Find CSS errors
- Understand webpage layout

IMPORTANT NOTE:

Changes made directly in Developer Tools
are temporary.

They are NOT automatically saved to our
HTML or CSS files.

To permanently keep a change, we must
write it in our actual code files.
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Developer Tools</title>

    <link rel="stylesheet" href="developer-tools.css">

</head>

<body>

    <h1>CSS Developer Tools</h1>

    <p class="intro">
        Developer Tools help us inspect and
        debug HTML and CSS.
    </p>

    <div class="box">

        <h2>Inspect Me</h2>

        <p>
            Right-click this box and select
            "Inspect" to open Developer Tools.
        </p>

    </div>

</body>

</html>
