<!--
CSS OVERFLOW - IMPORTANT TERMS

The overflow property controls what happens
when content is larger than its container.

1. visible
   Content is allowed to overflow outside
   the element.
   This is the default value.

2. hidden
   Extra content is clipped and hidden.

3. scroll
   Adds scrollbars so the hidden content
   can be viewed.

4. auto
   Adds scrollbars only when they are needed.

IMPORTANT:

overflow: visible;
→ Content can go outside the box.

overflow: hidden;
→ Extra content is hidden.

overflow: scroll;
→ Scrollbars are always shown.

overflow: auto;
→ Scrollbars appear when necessary.
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Overflow</title>

    <link rel="stylesheet" href="overflow.css">

</head>

<body>

    <h1>CSS Overflow</h1>

    <div class="box">

        This is a long piece of content inside
        a small box. Overflow controls what
        happens when the content does not fit
        inside the available space.

    </div>

</body>

</html>
