<!--
CSS BORDERS AND BACKGROUNDS - IMPORTANT TERMS

1. Border
   A border is a line around an HTML element.

2. border
   Sets the border around an element.

   Example:
   border: 2px solid black;

3. border-radius
   Makes the corners of an element rounded.

4. background-color
   Sets the background color of an element.

5. background-image
   Sets an image as the background.

6. background-repeat
   Controls whether a background image repeats.

IMPORTANT:

border:
→ Adds a border around an element.

border-radius:
→ Makes corners rounded.

background-color:
→ Changes the background color.

background-image:
→ Adds an image as the background.
-->

</body>

</html>
