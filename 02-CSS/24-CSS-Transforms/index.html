
<!--
IMPORTANT TERMS
1. transform: Changes an element's position, size, or angle.
2. rotate(): Rotates an element.
3. scale(): Changes an element's size.
4. translate(): Moves an element.
5. skew(): Tilts an element.
6. transform-origin: Sets the point around which a transform occurs.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transforms</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Transforms</h1>
    <p>Observe how each box changes.</p>

    <div class="container">
        <div class="box rotate">Rotate</div>
        <div class="box scale">Scale</div>
        <div class="box translate">Translate</div>
        <div class="box skew">Skew</div>
    </div>

    <h2>Hover over the boxes!</h2>

    <div class="container">
        <div class="box hover-box">Hover Me</div>
    </div>

</body>
</html>
