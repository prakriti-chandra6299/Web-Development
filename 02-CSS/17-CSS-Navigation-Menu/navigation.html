<!--
CSS NAVIGATION MENU - IMPORTANT TERMS

1. Navigation Menu
   A navigation menu contains links that help
   users move between different pages or sections.

2. <nav>
   Semantic HTML element used for navigation links.

3. list-style
   Controls the appearance of list markers.

4. display: inline
   Allows list items to appear on the same line.

5. padding
   Adds space inside an element.

6. background-color
   Changes the background of the menu.

IMPORTANT:

A navigation menu can be created using:

<nav>
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Navigation Menu</title>

    <link rel="stylesheet" href="navigation.css">

</head>

<body>

    <nav>

        <ul>

            <li><a href="#">Home</a></li>

            <li><a href="#">About</a></li>

            <li><a href="#">Services</a></li>

            <li><a href="#">Contact</a></li>

        </ul>

    </nav>

    <h1>My Website</h1>

    <p>
        This page contains a simple CSS navigation menu.
    </p>

</body>

</html>
