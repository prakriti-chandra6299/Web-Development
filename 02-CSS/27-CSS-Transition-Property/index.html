
<!--
IMPORTANT TERMS
1. Transition: Makes CSS property changes happen smoothly.
2. transition-property: Specifies which property changes.
3. transition-duration: Specifies how long the change takes.
4. transition-timing-function: Controls the speed pattern.
5. transition-delay: Waits before starting the change.
6. :hover: Applies styles when the pointer is over an element.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transition Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Transitions</h1>
    <p>Hover over the boxes to see smooth changes.</p>

    <section class="container">
        <div class="box color-box">Color</div>
        <div class="box size-box">Size</div>
        <div class="box move-box">Move</div>
        <div class="box rotate-box">Rotate</div>
    </section>

    <h2>Transition Timing Functions</h2>

    <section class="timing-container">
        <div class="timing-box ease">ease</div>
        <div class="timing-box linear">linear</div>
        <div class="timing-box ease-in">ease-in</div>
        <div class="timing-box ease-out">ease-out</div>
    </section>

</body>
</html>
