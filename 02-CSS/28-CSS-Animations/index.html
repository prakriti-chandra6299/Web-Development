
<!--
IMPORTANT TERMS
1. Animation: Changes an element's styles over time.
2. @keyframes: Defines the stages of an animation.
3. animation-name: Specifies the animation to use.
4. animation-duration: Sets how long one cycle takes.
5. animation-iteration-count: Sets how many times it repeats.
6. animation-direction: Controls the direction of animation.
7. animation-delay: Sets the waiting time before starting.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Animations</h1>
    <p>Watch the boxes move automatically.</p>

    <section class="container">
        <div class="box slide">Slide</div>
        <div class="box bounce">Bounce</div>
        <div class="box color-change">Color</div>
        <div class="box rotate">Rotate</div>
    </section>

    <h2>Hover over the boxes to pause them.</h2>

</body>
</html>
